<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="GearsBot World Builder — Create and customize 3D worlds with objects, models, physics, and animations for your robot simulations.">

  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="icon" href="favicon-128.png" sizes="128x128">
  <link rel="icon" href="favicon-167.png" sizes="167x167">
  <link rel="icon" href="favicon-192.png" sizes="192x192">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css?v=1d6f38da">
  <link rel="stylesheet" href="css/widgets.css?v=101e46c3">
  <link rel="stylesheet" href="css/builder-tools.css?v=1">
  <link rel="stylesheet" href="css/snap-editor.css?v=1">

  <script src="jquery/jquery-3.7.1.slim.min.js"></script>

  <!-- <script src="ammo/ammo-20210414.js"></script> -->
  <script src="ammo/ammo-20210414.wasm.js"></script>

  <script src="babylon/8.52.0/babylon.js"></script>
  <script src="babylon/8.52.0/babylonjs.loaders.min.js"></script>
  <script src="pep/0.5.3/pep.min.js"></script>

  <script src="js/msg.js"></script>
  <script src="js/common/widgets.js"></script>

  <title>GearsBot World Builder</title>
</head>

<body>
  <header>
    <img class="gearsIcon" src="favicon-32.png" alt="GearsBot Icon">
    <div>GearsBot World Builder</div>
  </header>

  <main>
    <nav>
      <ul class="panelTabs">
        <li id="navWorld" class="active">World</li>
      </ul>
      <div class="menuBar">
        <div class="menuItem fileMenu">File</div>
        <div class="menuItem worldMenu">World</div>
        <div class="menuItem snapMenu">Snap</div>
      </div>
    </nav>
    <div class="panels">
      <div class="panel active" aria-labelledby="navWorld">
        <canvas id="renderCanvas" touch-action="none"></canvas>
        <div class="worldInfo hide"></div>
        <div class="objectsWindow">
          <div class="buttons">
            <div class="addObject">Add</div>
            <div class="cloneObject">Clone</div>
            <div class="deleteObject">Delete</div>
          </div>
          <div class="objectsList"></div>
          <div class="buttons">
            <div class="undo disabled">Undo</div>
            <div class="redo disabled">Redo</div>
          </div>
        </div>
        <div class="objectID"></div>
        <div class="settingsWindow">
          <div class="settingsArea"></div>
        </div>

        <div class="gizmoToolbar">
          <div class="gizmoToolBtn active" data-mode="moveFree" title="Move Freely (W)">✋</div>
          <div class="gizmoToolBtn disabled" data-mode="movePlane" title="Move in Plane (W)">⬔</div>
          <div class="gizmoToolBtn disabled" data-mode="move" title="Move on Axis (W)">✥</div>
          <div class="gizmoToolSep"></div>
          <div class="gizmoToolBtn disabled" data-mode="rotate" title="Rotate (E)">⟳</div>
          <div class="gizmoToolBtn disabled" data-mode="scale" title="Scale (R)">⤡</div>
          <div class="gizmoToolSep" id="gizmoSepSnap" style="display:none;"></div>
          <div class="gizmoToolBtn disabled" id="gizmoBtnSnap" title="Edit Snap Points (S)" style="display:none; font-weight:bold;">S</div>
        </div>
        <div class="cameraPresets">
          <div class="cameraPresetBtn" data-preset="front" title="Front View (Numpad 1)">Front</div>
          <div class="cameraPresetBtn" data-preset="right" title="Right View (Numpad 3)">Right</div>
          <div class="cameraPresetBtn" data-preset="top" title="Top View (Numpad 7)">Top</div>
          <div class="cameraPresetBtn" data-preset="default3d" title="Default 3D View (Numpad 5)">3D</div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/worlds/World_Base.js?v=dc41bd9c"></script>
  <script src="js/worlds/world_Custom.js?v=d4e573d1"></script>
  <script src="js/robotComponents.js?v=0ba72082"></script>
  <script src="js/robotTemplates.js?v=40723022"></script>
  <script src="js/Wheel.js?v=99812854"></script>
  <script src="js/Robot.js?v=763dd32b"></script>
  <script>
    var robots = [];

    var robot = new Robot();
    robot.options = JSON.parse(JSON.stringify(robotTemplates[0]));
    robot.player = 'single';
    robots.push(robot);
  </script>
  <script src="js/babylon.js?v=c9ff1330"></script>
  <script src="js/simPanel.js?v=218a6426"></script>
  <script src="js/builtInImages.js?v=b19ef42d"></script>
  <script src="js/builtInModels.js?v=82f73098"></script>
  <script src="js/GenConfig.js?v=683ff770"></script>
  <script src="js/common/undoManager.js?v=1"></script>
  <script src="js/common/cameraUtils.js?v=1"></script>
  <script src="js/common/snapPointsDB.js?v=1"></script>
  <script src="js/common/snapManager.js?v=1"></script>
  <script src="js/common/customGizmo.js?v=1"></script>
  <script src="js/common/catalogThumbnails.js?v=1"></script>
  <script src="js/common/viewCube.js?v=1"></script>
  <script src="js/common/snapPointEditor.js?v=1"></script>
  <script src="js/builder.js?v=0aba6272"></script>

</body>

</html>
